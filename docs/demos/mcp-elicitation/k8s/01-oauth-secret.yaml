---
# OAuth Secret for MCP Elicitation Demo
# This secret contains OAuth credentials for authentication between services
# 
# IMPORTANT: Update these placeholder values with your actual OAuth credentials
# before deploying to production.
#
# To update the secret after deployment:
#   kubectl create secret generic mcp-elicitation-oauth-secret \
#     --from-literal=CLIENT_ID=your-client-id \
#     --from-literal=CLIENT_SECRET=your-client-secret \
#     --namespace=kagenti-mcp-elicitation \
#     --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: mcp-elicitation-oauth-secret
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: mcp-elicitation-oauth-secret
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: kagenti
type: Opaque
stringData:
  # OAuth Client ID - Replace with your actual client ID
  CLIENT_ID: "REPLACE_WITH_YOUR_CLIENT_ID"
  
  # OAuth Client Secret - Replace with your actual client secret
  CLIENT_SECRET: "REPLACE_WITH_YOUR_CLIENT_SECRET"
  
  # OAuth Authorization Endpoint (optional, can be configured per service)
  AUTH_ENDPOINT: "https://your-oauth-provider.com/oauth/authorize"
  
  # OAuth Token Endpoint (optional, can be configured per service)
  TOKEN_ENDPOINT: "https://your-oauth-provider.com/oauth/token"

