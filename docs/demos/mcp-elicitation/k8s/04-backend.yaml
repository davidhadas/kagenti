---
# Backend Config ConfigMap
# Contains backend-config.yaml for the backend service
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: kagenti
data:
  backend-config.yaml: |
    port: 8187
    aiagent_url: "http://git-issue-agent.team1.svc.cluster.local:8080"
    demo_page_path: "/usr/share/nginx/html/index.html"
    token_broker_url: "http://token-broker.kagenti-mcp-elicitation.svc.cluster.local:8190"
    keycloak_url: "http://keycloak-service.keycloak.svc.cluster.local:8080"
    keycloak_realm: "kagenti"

---
# Demo UI ConfigMap
# Contains the HTML interface for interacting with the MCP demo
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-demo-ui
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: kagenti
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MCP Elicitation Demo - Interactive</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
            }
            .container {
                background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                max-width: 900px; width: 100%; padding: 40px;
            }
            h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
            .subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }
            .architecture {
                background: #f0f7ff; border: 2px solid #4a90e2; border-radius: 8px;
                padding: 15px; margin-bottom: 20px; font-family: monospace; font-size: 12px;
            }
            .status { padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; }
            .status.info { background: #e3f2fd; color: #1976d2; border-left: 4px solid #1976d2; }
            .status.success { background: #e8f5e9; color: #388e3c; border-left: 4px solid #388e3c; }
            .status.error { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }
            button {
                background: #667eea; color: white; border: none; padding: 12px 24px;
                border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer;
                transition: all 0.3s; margin-right: 10px; margin-bottom: 10px;
            }
            button:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
            button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
            .section { margin-bottom: 30px; padding: 20px; background: #f8f9fa; border-radius: 8px; }
            .section h2 { color: #333; font-size: 18px; margin-bottom: 15px; }
            pre {
                background: #2d2d2d; color: #f8f8f2; padding: 15px; border-radius: 6px;
                overflow-x: auto; font-size: 13px; line-height: 1.5; max-height: 400px;
            }
            .input-group { margin-bottom: 15px; }
            .input-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
            .input-group input, .input-group textarea {
                width: 100%; padding: 10px; border: 2px solid #ddd;
                border-radius: 6px; font-size: 14px; font-family: inherit;
            }
            .input-group input:focus, .input-group textarea:focus { outline: none; border-color: #667eea; }
            .input-group textarea { min-height: 80px; resize: vertical; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 MCP Elicitation Demo - Interactive</h1>
            <p class="subtitle">Model Context Protocol Integration with Kagenti</p>
            
            <div class="architecture">
                <div style="font-weight: bold; margin-bottom: 10px;">Architecture:</div>
                <div>Browser → Backend:30187 → MCP Server:30184 (with authbridge)</div>
                <div>Token Broker manages OAuth sessions and token caching</div>
            </div>
            
            <div id="status" class="status info">
                Ready to test! Enter a user ID and submit a task.
            </div>
            
            <div class="section">
                <h2>User Authentication</h2>
                <div class="input-group">
                    <label for="username">Keycloak Username:</label>
                    <input type="text" id="username" placeholder="e.g., demo-user" value="demo-user">
                </div>
                <div class="input-group">
                    <label for="password">Keycloak Password:</label>
                    <input type="password" id="password" placeholder="Enter your password" value="">
                </div>
            </div>
            
            <div class="section">
                <h2>Submit Tasks</h2>
                <div style="margin-bottom: 15px;">
                    <button onclick="submitTask('Get my GitHub profile')">👤 Get Profile</button>
                    <button onclick="submitTask('List my repositories')">📚 List Repos</button>
                    <button onclick="submitTask('List available tools')">🔧 List Tools</button>
                </div>
                
                <div class="input-group">
                    <label for="customTask">Custom Task:</label>
                    <textarea id="customTask" placeholder="Enter a custom task for the MCP server..."></textarea>
                </div>
                <button onclick="submitCustomTask()">▶️ Submit Custom Task</button>
                
                <div id="result" style="margin-top: 20px;"></div>
            </div>
        </div>

        <script>
            let currentJobId = null;
            let pollInterval = null;
            let oauthWindow = null;

            async function submitTask(task) {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                
                if (!username) {
                    showStatus('error', 'Please enter a username');
                    return;
                }
                if (!password) {
                    showStatus('error', 'Please enter a password');
                    return;
                }

                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = '<p>Submitting task...</p>';
                showStatus('info', `Submitting task: "${task}"...`);

                try {
                    // Step 1: Submit task with credentials and get job_id
                    const response = await fetch('/task', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: username,
                            username: username,
                            password: password,
                            task: task
                        })
                    });

                    if (!response.ok) {
                        // Try to parse as JSON, but handle plain text errors too
                        const contentType = response.headers.get('content-type');
                        let errorMessage = 'Task submission failed';
                        
                        if (contentType && contentType.includes('application/json')) {
                            try {
                                const error = await response.json();
                                errorMessage = error.message || error.error || errorMessage;
                                resultDiv.innerHTML = '<pre>' + JSON.stringify(error, null, 2) + '</pre>';
                            } catch (e) {
                                const text = await response.text();
                                errorMessage = text || errorMessage;
                                resultDiv.innerHTML = '<pre>' + text + '</pre>';
                            }
                        } else {
                            const text = await response.text();
                            errorMessage = text || errorMessage;
                            resultDiv.innerHTML = '<pre>' + text + '</pre>';
                        }
                        
                        showStatus('error', 'Error: ' + errorMessage);
                        return;
                    }

                    const data = await response.json();
                    currentJobId = data.job_id;

                    console.log('Task submitted, job_id:', currentJobId);
                    showStatus('info', 'Task submitted. Waiting for result...');
                    resultDiv.innerHTML = '<p>Processing... (Job ID: ' + currentJobId + ')</p>';

                    // Step 2: Start polling for job status
                    startPolling(currentJobId);

                } catch (error) {
                    showStatus('error', 'Error: ' + error.message);
                    resultDiv.innerHTML = '<p style="color: #c62828;">Error: ' + error.message + '</p>';
                }
            }

            function submitCustomTask() {
                const customTask = document.getElementById('customTask').value.trim();
                if (!customTask) {
                    showStatus('error', 'Please enter a custom task');
                    return;
                }
                submitTask(customTask);
            }

            function startPolling(jobId) {
                // Clear any existing poll interval
                if (pollInterval) {
                    clearInterval(pollInterval);
                }

                // Poll every 1 second
                pollInterval = setInterval(() => pollJobStatus(jobId), 1000);

                // Also poll immediately
                pollJobStatus(jobId);
            }

            async function pollJobStatus(jobId) {
                try {
                    const response = await fetch('/job/' + jobId);
                    
                    if (!response.ok) {
                        console.error('Failed to fetch job status:', response.status);
                        return;
                    }

                    const status = await response.json();
                    console.log('Job status:', status);

                    const resultDiv = document.getElementById('result');

                    switch (status.status) {
                        case 'pending':
                            showStatus('info', 'Task pending...');
                            resultDiv.innerHTML = '<p>Task is pending...</p>';
                            break;

                        case 'processing':
                            showStatus('info', 'Task is processing...');
                            resultDiv.innerHTML = '<p>Task is being processed...</p>';
                            break;

                        case 'oauth_required':
                            showStatus('info', 'GitHub authorization required. Opening login page...');
                            resultDiv.innerHTML = '<p>Waiting for GitHub authorization...</p>';
                            
                            // Open OAuth popup if not already open
                            if (status.auth_url && (!oauthWindow || oauthWindow.closed)) {
                                oauthWindow = window.open(status.auth_url, '_blank', 'width=600,height=700');
                            }
                            break;

                        case 'completed':
                            // Stop polling
                            if (pollInterval) {
                                clearInterval(pollInterval);
                                pollInterval = null;
                            }
                            
                            showStatus('success', 'Task completed successfully!');
                            resultDiv.innerHTML = '<pre>' + JSON.stringify(status.result, null, 2) + '</pre>';
                            
                            // Close OAuth window if open
                            if (oauthWindow && !oauthWindow.closed) {
                                oauthWindow.close();
                            }
                            break;

                        case 'failed':
                            // Stop polling
                            if (pollInterval) {
                                clearInterval(pollInterval);
                                pollInterval = null;
                            }
                            
                            showStatus('error', 'Task failed: ' + (status.error || 'Unknown error'));
                            resultDiv.innerHTML = '<p style="color: #c62828;">Error: ' + status.error + '</p>';
                            
                            // Close OAuth window if open
                            if (oauthWindow && !oauthWindow.closed) {
                                oauthWindow.close();
                            }
                            break;
                    }

                } catch (error) {
                    console.error('Error polling job status:', error);
                }
            }

            function showStatus(type, message) {
                const statusDiv = document.getElementById('status');
                statusDiv.className = `status ${type}`;
                statusDiv.innerHTML = message;
            }

            // Clean up on page unload
            window.addEventListener('beforeunload', () => {
                if (pollInterval) {
                    clearInterval(pollInterval);
                }
                if (oauthWindow && !oauthWindow.closed) {
                    oauthWindow.close();
                }
            });
        </script>
    </body>
    </html>

---
# Backend Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kagenti

---
# Backend Deployment
# This service provides the demo UI and supporting backend operations
# It does NOT require authbridge sidecar injection (user-facing service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kagenti
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: backend
      annotations:
        # Explicitly disable authbridge injection for user-facing service
        kagenti.io/client-registration-inject: "false"
    spec:
      serviceAccountName: backend
      containers:
      - name: backend
        image: localhost/kagenti-backend-local:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8187
          protocol: TCP
        env:
        # MCP Server configuration
        - name: MCP_SERVER_URL
          value: "http://mcp-server.kagenti-mcp-elicitation.svc.cluster.local:8184"
        - name: TOKEN_BROKER_URL
          value: "http://token-broker.kagenti-mcp-elicitation.svc.cluster.local:8190"
        
        # Agent Service configuration
        - name: AGENT_SERVICE_URL
          value: "http://git-issue-agent.team1.svc.cluster.local:8080"
        
        # Keycloak configuration for authentication
        - name: KEYCLOAK_URL
          value: "http://keycloak-service.keycloak.svc.cluster.local:8080"
        - name: KEYCLOAK_REALM
          value: "kagenti"
        
        # Service configuration
        - name: PORT
          value: "8187"
        - name: LOG_LEVEL
          value: "info"
        
        # Demo UI configuration
        - name: DEMO_MODE
          value: "true"
        - name: DEMO_PAGE_PATH
          value: "/usr/share/nginx/html/index.html"
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        # Mount the demo UI and config ConfigMaps
        volumeMounts:
        - name: demo-ui
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: backend-config
          mountPath: /config
          readOnly: true
        
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      volumes:
      - name: demo-ui
        configMap:
          name: backend-demo-ui
      - name: backend-config
        configMap:
          name: backend-config
      
      restartPolicy: Always

---
# Backend Service
# Exposed via NodePort for external access on port 30187
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kagenti
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: backend
  ports:
  - name: http
    port: 8187
    targetPort: http
    nodePort: 30187
    protocol: TCP

