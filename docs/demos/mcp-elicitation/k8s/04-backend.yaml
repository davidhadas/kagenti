---
# Demo UI ConfigMap
# Contains the HTML interface for interacting with the MCP demo
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-demo-ui
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: kagenti
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MCP Elicitation Demo</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }
            .container {
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                max-width: 800px;
                width: 100%;
                padding: 40px;
            }
            h1 {
                color: #667eea;
                margin-bottom: 10px;
                font-size: 2.5em;
            }
            .subtitle {
                color: #666;
                margin-bottom: 30px;
                font-size: 1.1em;
            }
            .info-section {
                background: #f8f9fa;
                border-left: 4px solid #667eea;
                padding: 20px;
                margin: 20px 0;
                border-radius: 8px;
            }
            .info-section h2 {
                color: #333;
                margin-bottom: 15px;
                font-size: 1.5em;
            }
            .info-section p {
                color: #555;
                line-height: 1.6;
                margin-bottom: 10px;
            }
            .endpoint {
                background: white;
                padding: 15px;
                border-radius: 8px;
                margin: 10px 0;
                border: 1px solid #ddd;
            }
            .endpoint-title {
                font-weight: bold;
                color: #667eea;
                margin-bottom: 5px;
            }
            .endpoint-url {
                font-family: 'Courier New', monospace;
                color: #333;
                word-break: break-all;
            }
            .status {
                display: inline-block;
                padding: 5px 15px;
                border-radius: 20px;
                font-size: 0.9em;
                font-weight: bold;
            }
            .status.active {
                background: #d4edda;
                color: #155724;
            }
            .features {
                list-style: none;
                padding: 0;
            }
            .features li {
                padding: 10px 0;
                border-bottom: 1px solid #eee;
            }
            .features li:last-child {
                border-bottom: none;
            }
            .features li:before {
                content: "✓";
                color: #667eea;
                font-weight: bold;
                margin-right: 10px;
            }
            .footer {
                margin-top: 30px;
                padding-top: 20px;
                border-top: 2px solid #eee;
                text-align: center;
                color: #666;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 MCP Elicitation Demo</h1>
            <p class="subtitle">Model Context Protocol Integration with Kagenti</p>
            <span class="status active">● Active</span>
            
            <div class="info-section">
                <h2>About This Demo</h2>
                <p>
                    This demo showcases Kagenti's integration with Model Context Protocol (MCP) servers,
                    demonstrating secure authentication and authorization flows using custom authbridge sidecars.
                </p>
            </div>

            <div class="info-section">
                <h2>Service Endpoints</h2>
                
                <div class="endpoint">
                    <div class="endpoint-title">MCP Server</div>
                    <div class="endpoint-url">http://<node-ip>:30184</div>
                    <p style="margin-top: 10px; color: #666; font-size: 0.9em;">
                        Model Context Protocol server with authbridge sidecar injection
                    </p>
                </div>

                <div class="endpoint">
                    <div class="endpoint-title">Backend Service</div>
                    <div class="endpoint-url">http://<node-ip>:30187</div>
                    <p style="margin-top: 10px; color: #666; font-size: 0.9em;">
                        Backend service providing demo UI and supporting operations
                    </p>
                </div>

                <div class="endpoint">
                    <div class="endpoint-title">Token Broker (Internal)</div>
                    <div class="endpoint-url">http://token-broker.kagenti-mcp-elicitation.svc.cluster.local:8190</div>
                    <p style="margin-top: 10px; color: #666; font-size: 0.9em;">
                        Internal token management service (ClusterIP only)
                    </p>
                </div>
            </div>

            <div class="info-section">
                <h2>Key Features</h2>
                <ul class="features">
                    <li>Custom authbridge sidecar for MCP server authentication</li>
                    <li>OAuth-based token management via Token Broker</li>
                    <li>Secure inter-service communication</li>
                    <li>Model Context Protocol (MCP) integration</li>
                    <li>Kubernetes-native deployment</li>
                </ul>
            </div>

            <div class="info-section">
                <h2>Architecture</h2>
                <p>
                    The demo consists of three main services:
                </p>
                <ul class="features">
                    <li><strong>Token Broker:</strong> Manages OAuth tokens and credentials (internal service)</li>
                    <li><strong>MCP Server:</strong> Implements MCP protocol with authbridge sidecar (external access)</li>
                    <li><strong>Backend:</strong> Provides UI and supporting operations (external access)</li>
                </ul>
            </div>

            <div class="footer">
                <p>Made with Bob | Kagenti MCP Elicitation Demo</p>
                <p style="margin-top: 10px; font-size: 0.9em;">
                    For more information, see the 
                    <a href="https://github.com/kagenti/kagenti" style="color: #667eea;">Kagenti documentation</a>
                </p>
            </div>
        </div>
    </body>
    </html>

---
# Backend Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kagenti

---
# Backend Deployment
# This service provides the demo UI and supporting backend operations
# It does NOT require authbridge sidecar injection (user-facing service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kagenti
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: backend
      annotations:
        # Explicitly disable authbridge injection for user-facing service
        kagenti.io/client-registration-inject: "false"
    spec:
      serviceAccountName: backend
      containers:
      - name: backend
        image: ghcr.io/davidhadas/kagenti-backend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8187
          protocol: TCP
        env:
        # MCP Server configuration
        - name: MCP_SERVER_URL
          value: "http://mcp-server.kagenti-mcp-elicitation.svc.cluster.local:8184"
        
        # Service configuration
        - name: PORT
          value: "8187"
        - name: LOG_LEVEL
          value: "info"
        
        # Demo UI configuration
        - name: DEMO_MODE
          value: "true"
        - name: UI_PATH
          value: "/usr/share/nginx/html"
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        # Mount the demo UI ConfigMap
        volumeMounts:
        - name: demo-ui
          mountPath: /usr/share/nginx/html
          readOnly: true
        
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      volumes:
      - name: demo-ui
        configMap:
          name: backend-demo-ui
      
      restartPolicy: Always

---
# Backend Service
# Exposed via NodePort for external access on port 30187
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kagenti
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: backend
  ports:
  - name: http
    port: 8187
    targetPort: http
    nodePort: 30187
    protocol: TCP

