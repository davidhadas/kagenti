---
# MCP Server Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: kagenti

---
# MCP Server Deployment
# This is a standalone service that implements the Model Context Protocol for tool integration.
# It receives authenticated requests from Kagenti agents (which have authbridge sidecars injected).
# The MCP server itself does NOT need authbridge injection - it's just a service endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: kagenti
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/component: mcp
      annotations:
        kagenti.io/service-type: "mcp-server"
    spec:
      serviceAccountName: mcp-server
      containers:
      - name: mcp-server
        image: ghcr.io/davidhadas/kagenti-mcp-server:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8082
          protocol: TCP
        env:
        # Token Broker configuration
        - name: TOKEN_BROKER_URL
          value: "http://token-broker.kagenti-mcp-elicitation.svc.cluster.local:8190"
        
        # OAuth configuration from secret
        - name: CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mcp-elicitation-oauth-secret
              key: CLIENT_ID
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mcp-elicitation-oauth-secret
              key: CLIENT_SECRET
        - name: AUTH_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: mcp-elicitation-oauth-secret
              key: AUTH_ENDPOINT
              optional: true
        - name: TOKEN_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: mcp-elicitation-oauth-secret
              key: TOKEN_ENDPOINT
              optional: true
        
        # Service configuration
        - name: PORT
          value: "8082"
        - name: LOG_LEVEL
          value: "info"
        - name: MCP_PROTOCOL_VERSION
          value: "2024-11-05"
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always

---
# MCP Server Service
# Exposed via NodePort for external access on port 30184
# The service maps external port 8184 to container port 8082
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: kagenti-mcp-elicitation
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: kagenti
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
  - name: http
    port: 8184
    targetPort: http
    nodePort: 30184
    protocol: TCP

